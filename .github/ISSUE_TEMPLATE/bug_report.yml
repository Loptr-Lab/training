name: Bug or accessibility fix
description: Report a reproducible problem and propose a useful correction.
title: "[Fix] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Describe the issue with evidence and a constructive next step. Do not include secrets, medical records, or private correspondence."
  - type: input
    id: location
    attributes:
      label: Page or file
      description: Provide a public URL or repository path.
      placeholder: docs/index.html
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What is wrong?
      description: Observed behavior, reproduction steps, device or browser if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and impact
      description: Explain which task is blocked, confusing, or inaccessible.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix or next test
      description: Provide a patch, minimal example, or concrete investigation path. A fix is welcome but not mandatory for safety or security concerns.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public sharing
      options:
        - label: I removed private identifiers, credentials, and sensitive records.
          required: true
