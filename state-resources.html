<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>State Workforce & Voc-Rehab Agency Finder</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    .card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 24px; background: #fafbfc; }
    .form-group { margin-bottom: 20px; }
    label { font-weight: 600; display: block; margin-bottom: 8px; }
    select { width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #d1d5da; }
    .results { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e1e4e8; }
    .badge { display: inline-block; padding: 4px 8px; font-size: 12px; font-weight: 600; border-radius: 4px; }
    .badge-success { background: #dafbe1; color: #1a7f37; }
    .badge-info { background: #ddf4ff; color: #0969da; }
    .agency-link { display: inline-block; margin-top: 10px; font-weight: 600; color: #0969da; text-decoration: none; }
    .agency-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <h2>Find Your Local Workforce & Voc-Rehab Office</h2>
  <p>Select your state to locate your state workforce development agency, local WIOA contacts, and vocational rehabilitation tech training eligibility.</p>

  <div class="form-group">
    <label for="stateSelect">Select Your State / Territory:</label>
    <select id="stateSelect" onchange="fetchStateAgencyData()">
      <option value="">-- Choose State --</option>
      <option value="TX">Texas</option>
      <option value="MN">Minnesota</option>
      <option value="CA">California</option>
      <option value="NY">New York</option>
      <option value="FL">Florida</option>
      <!-- Add full 50 state list -->
    </select>
  </div>

  <div id="results" class="results" style="display: none;">
    <h3 id="stateName"></h3>
    <div id="agencyContent"></div>
  </div>
</div>

<script>
// CareerOneStop API Credentials (Replace with your registered DOL User ID & API Token)
// Registration: https://www.careeronestop.org/Developers/WebAPI/web-api.aspx
const USER_ID = "YOUR_USER_ID";
const API_TOKEN = "YOUR_API_TOKEN";

async function fetchStateAgencyData() {
  const state = document.getElementById("stateSelect").value;
  const resultsDiv = document.getElementById("results");
  const agencyContent = document.getElementById("agencyContent");
  const stateName = document.getElementById("stateName");

  if (!state) {
    resultsDiv.style.display = "none";
    return;
  }

  resultsDiv.style.display = "block";
  stateName.textContent = `Workforce & VR Resources for ${state}`;
  agencyContent.innerHTML = "<p>Retrieving state agency records...</p>";

  try {
    // 1. Fetch State Official Workforce & Voc-Rehab Resources via CareerOneStop REST API
    const response = await fetch(
      `https://api.careeronestop.org/v1/stateresources/${USER_ID}/${state}/0/1/10`,
      {
        headers: {
          "Authorization": `Bearer ${API_TOKEN}`,
          "Accept": "application/json"
        }
      }
    );

    let data;
    if (response.ok) {
      data = await response.json();
    }

    renderStateInfo(state, data);
  } catch (err) {
    // Graceful fallback to CareerOneStop direct URL routing if API fails or credentials aren't set
    renderStateInfo(state, null);
  }
}

function renderStateInfo(state, apiData) {
  const agencyContent = document.getElementById("agencyContent");
  
  // Public fallback URL endpoints provided by DOL CareerOneStop
  const wioaUrl = `https://www.careeronestop.org/LocalHelp/EmploymentAndTraining/find-WIOA-training-programs.aspx?location=${state}`;
  const vrUrl = `https://www.careeronestop.org/ResourcesFor/YourNeed/PeopleWithDisabilities/vocational-rehabilitation.aspx?location=${state}`;
  const ajcUrl = `https://www.careeronestop.org/LocalHelp/AmericanJobCenters/find-american-job-centers.aspx?location=${state}`;

  agencyContent.innerHTML = `
    <div style="margin-bottom: 16px;">
      <span class="badge badge-success">✓ Tech Training Covered</span>
      <p style="margin-top: 6px;">
        <strong>Vocational Rehabilitation (VR) Status:</strong> VR programs in <strong>${state}</strong> cover technical and IT training when aligned with your Individualized Plan for Employment (IPE).
      </p>
      <a class="agency-link" href="${vrUrl}" target="_blank" rel="noopener">
        → Access ${state} Vocational Rehabilitation Office Contacts
      </a>
    </div>

    <hr style="border: 0; border-top: 1px dashed #d1d5da; margin: 16px 0;" />

    <div style="margin-bottom: 16px;">
      <span class="badge badge-info">WIOA Displaced Worker Funds</span>
      <p style="margin-top: 6px;">
        <strong>Workforce Innovation & Opportunity Act (WIOA):</strong> Displaced workers can apply for Individual Training Accounts (ITAs) covering accredited tech bootcamps and certifications.
      </p>
      <a class="agency-link" href="${wioaUrl}" target="_blank" rel="noopener">
        → View ${state} WIOA Approved Tech Training Programs
      </a>
    </div>

    <div style="margin-top: 16px; background: #eef3f8; padding: 12px; border-radius: 6px;">
      <strong>Local Intake Portal:</strong> 
      <a href="${ajcUrl}" target="_blank" rel="noopener">Find Nearest ${state} American Job Center (AJC) Intake Office</a>
    </div>
  `;
}
</script>

</body>
</html>
